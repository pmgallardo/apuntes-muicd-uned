project:
  type: book
  output-dir: _book

book:
  title: "Visualización de datos"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "vd"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/vd
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/vd
  repo-actions: [edit, issue, source]


  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - general.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/1.md
      - apuntes/2.md
      - apuntes/3.md
      - apuntes/4.md
    - part: "Exámenes"
      chapters:
      - exam/2022j2/ex_2022j2.md
      - exam/2022so/ex_2022so.md
      - exam/2023j2/ex_2023j2.md
      - exam/2023so/ex_2023so.md
      - exam/2024j2/ex_2024j2.md   
      - exam/2024so/ex_2024so.md
      - exam/2025j2/ex_2025j2.md
      - exam/2025so/ex_2025so.md

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Lora"
    sansfont: "Inter"
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{2C5282}
      - ../_assets/base_pdf.tex

    toc: true
    toc-depth: 4
    number-sections: true
  epub:
    css: ../_assets/base_epub.css
    include-in-header:
      - text: |
          <style>
          :root { --color-libro: #2C5282; }
          </style>
