project:
  type: book
  output-dir: _book

book:
  title: "Modelado estadístico de datos"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "med"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/med
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/med
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/estruc_contenido.md
      - apuntes/_1a.md
      - apuntes/_2a.md
      - apuntes/01a.md
      - apuntes/01b.md
      - apuntes/02a.md
      - apuntes/03a.md
      - apuntes/04a.md
      - apuntes/05a.md
      - apuntes/06a.md
      - apuntes/07a.md
      - apuntes/08a.md
      - apuntes/09a.md
      - apuntes/09b.md
      - apuntes/10a.md
    - part: "Exámenes"
      chapters:
      - exam/20250202/ex_20250202.md
      - exam/20250206/ex_20250206.md
      - exam/20250903/ex_20250903.md

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    
    mainfont: "Lora"               # Quarto inyecta la fuente Serif
    sansfont: "Inter"              # Quarto inyecta la fuente Sans
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{2B6CB0}
      - ../_assets/base_pdf.tex

    toc: true
    toc-depth: 4
    number-sections: true
  epub:
    css: ../_assets/base_epub.css
    include-in-header:
      - text: |
          <style>
          :root { --color-libro: #2B6CB0; }
          </style>
