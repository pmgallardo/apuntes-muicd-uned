project:
  type: book
  output-dir: _book

book:
  title: "Minería de textos"
  subtitle: "Guía de estudio del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  downloads: [pdf, epub]
  output-file: "mt"
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/mt
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/mt
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    tools:
    - icon: house
      href: https://pmgallardo.github.io/apuntes-muicd-uned
      text: "Web principal"
    
  chapters:
    - index.qmd
    - general.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/0.qmd
      - apuntes/1.qmd
      - apuntes/2.qmd
      - apuntes/3.qmd
      - apuntes/4.qmd
      - apuntes/5.qmd
    - part: "Exámenes"
      chapters:
      - exam/2020f2/2020f2.md
      - exam/2020fr/2020fr.md
      - exam/2022f2/2022f2.md
      - exam/2022so/2022so.md
      - exam/2023f2/2023f2.md
      - exam/2023so/2023so.md
      - exam/2024f2/2024f2.md
      - exam/2024so/2024so.md
      - exam/2025f2/2025f2.md
      - exam/2025so/2025so.md
      - exam/2026f2/2026f2.md
      - exam/2026so/2026so.md
    - part: "Anexos"
      chapters:
      - anexos/contribuciones.qmd
      - anexos/licencia.qmd

lang: es-ES
number-sections: false

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{6B46C1}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
