project:
  type: book
  output-dir: _book

book:
  title: "Minería de textos"
  subtitle: "Guía de estudio del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "mt"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/mt
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/mt
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - general.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/1.md
      - apuntes/2.md
      - apuntes/3.md
      - apuntes/4.md
      - apuntes/5.md

lang: es

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Source Code Pro"

    fontsize: 11pt
    linestretch: 1.15

    papersize: a4

    geometry:
      - top=25mm
      - bottom=25mm
      - left=27mm
      - right=25mm

    toc: true
    toc-depth: 4
    number-sections: true
