project:
  type: book
  output-dir: _book

book:
  title: "Minería de datos de los medios sociales"
  subtitle: "Guía de estudio del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "mdms"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/mdms
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/mdms
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    tools:
    - icon: house
      href: https://pmgallardo.github.io/apuntes-muicd-uned
      text: "Web principal"
    
  chapters:
    - index.qmd
    - general.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/0.qmd
      - apuntes/1.qmd
      - apuntes/2.qmd
      - apuntes/3.qmd
    - part: "Repaso"
      chapters:
      - repaso/repaso.md
    - part: "Exámenes"
      chapters:
      - exam/2022j2/ex_2022j2.md
      - exam/2023j2/ex_2023j2.md
      - exam/2023so/ex_2023so.md
      - exam/2024j2/ex_2024j2.md   
      - exam/2024so/ex_2024so.md
      - exam/2025j2/ex_2025j2.md
      - exam/2025so/ex_2025so.md
      - exam/2026j2/ex_2026j2.md
      - exam/2026jr/ex_2026jr.md
    - part: "Anexos"
      chapters:
      - anexos/contribuciones.qmd
      - anexos/licencia.qmd

lang: es-ES
number-sections: false

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{B794F4}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
