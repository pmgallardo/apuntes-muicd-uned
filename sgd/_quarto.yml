project:
  type: book
  output-dir: _book

book:
  title: "Seguridad de la gestión de datos"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "sgd"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/sgd
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/sgd
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/p1.md
      - apuntes/t1.md
      - apuntes/t2.md
      - apuntes/t3.md
      - apuntes/t4.md
      - apuntes/t5.md
    - part: "Exámenes"
      chapters:
      - exam/2022j2/ex_2022j2.md
      - exam/2022so/ex_2022so.md
      - exam/2023j2/ex_2023j2.md
      - exam/2023so/ex_2023so.md
      - exam/2024j2/ex_2024j2.md   
      - exam/2024so/ex_2024so.md
      - exam/2025j2/ex_2025j2.md
      - exam/2025so/ex_2025so.md

lang: es

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Source Sans 3"
    sansfont: "Source Sans 3"
    monofont: "Source Code Pro"

    fontsize: 11pt
    linestretch: 1.15

    papersize: a4

    geometry:
      - top=25mm
      - bottom=25mm
      - left=27mm
      - right=25mm

    toc: true
    toc-depth: 4
    number-sections: true
