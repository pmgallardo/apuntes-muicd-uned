project:
  type: book
  output-dir: _book

book:
  title: "Aprendizaje automático II"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "aaii"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/aaii
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/aaii
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/0.md
      - apuntes/1.md
      - apuntes/2.md
      - apuntes/3.md
    - part: "Exámenes"
      chapters:
      - exam/2022j2/aaii_ex_2022j2.md
      - exam/2022so/aaii_ex_2022so.md
      - exam/2023j2/aaii_ex_2023j2.md
      - exam/2024j2/aaii_ex_2024j2.md
      - exam/2024so/aaii_ex_2024so.md
      - exam/2025j2/aaii_ex_2025j2.md
      - exam/2025so/aaii_ex_2025so.md
      - exam/2026j2/aaii_ex_2026j2.md

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{7F9CF5}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: ../_assets/base_epub.css
    include-in-header:
      - text: |
          <style>
          :root { --color-libro: #7F9CF5; }
          </style>
