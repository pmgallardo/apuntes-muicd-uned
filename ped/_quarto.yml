project:
  type: book
  output-dir: _book

book:
  title: "Programación en entorno de datos"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  
  downloads: [pdf, epub]
  output-file: "ped"
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/ped
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/ped
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    tools:
    - icon: house
      href: https://pmgallardo.github.io/apuntes-muicd-uned
      text: "Web principal"
    
  chapters:
    - index.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/estruc-contenido-simple.qmd
      - apuntes/01.qmd
      - apuntes/02.qmd
      - apuntes/03.qmd
      - apuntes/04.qmd
    - part: "Exámenes"
      chapters:
      - exam/20220210/ex_20220210.ipynb
    - part: "Anexos"
      chapters:
      - anexos/contribuciones.qmd
      - anexos/licencia.qmd

lang: es-ES
number-sections: false

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{3182CE}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
