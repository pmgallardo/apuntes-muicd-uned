project:
  type: book
  output-dir: _book

book:
  title: "Deep learning"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  output-file: "dl"
  downloads: [pdf, epub]
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/dl
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/dl
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    
  chapters:
    - index.qmd

lang: es

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right-body
    number-sections: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex

    mainfont: "Lora"
    sansfont: "Inter"
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{4A5568}
      - ../_assets/base_pdf.tex

    toc: true
    toc-depth: 4
    number-sections: true
  epub:
    css: ../_assets/base_epub.css
    include-in-header:
      - text: |
          <style>
          :root { --color-libro: #4A5568; }
          </style>
