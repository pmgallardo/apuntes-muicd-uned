project:
  type: book
  output-dir: _book

book:
  title: "Gestión/almacenamiento de la información no estructurada"
  subtitle: "Guía de estudio de la asignatura del MUICD de la UNED"
  author: "Colaboradores de apuntes-muicd-uned"
  date: today
  language: es
  downloads: [pdf, epub]
  output-file: "gaine"
  
  site-url: https://pmgallardo.github.io/apuntes-muicd-uned/gaine
  repo-url: https://github.com/pmgallardo/apuntes-muicd-uned/gaine
  repo-actions: [edit, issue, source]

  sidebar:
    style: "docked"
    search: true
    tools:
    - icon: house
      href: https://pmgallardo.github.io/apuntes-muicd-uned
      text: "Web principal"
    
  chapters:
    - index.qmd
    - general.qmd
    - part: "Apuntes"
      chapters:
      - apuntes/1.md
      - apuntes/2.md
      - apuntes/3.md
      - apuntes/4.md
      - apuntes/5.md
    - part: "Repaso"
      chapters:
      - repaso/repaso.md
    - part: "Exámenes"
      chapters:
      - exam/2022j2/gaine_ex_2022j2.md
      - exam/2022so/gaine_ex_2022so.md
      - exam/2023j2/ex_2023j2.md
      - exam/2023so/ex_2023so.md
      - exam/2024j2/ex_2024j2.md   
      - exam/2024so/ex_2024so.md
      - exam/2025j2/ex_2025j2.md
      - exam/2025so/ex_2025so.md
    - part: "Anexos"
      chapters:
      - anexos/contribuciones.qmd
      - anexos/licencia.qmd

lang: es-ES
number-sections: false

format:
  html:
    theme:
      - default
      - ../_assets/base_html.scss
      - color.scss
    toc: true
    toc-depth: 4
    toc-location: right
  pdf:
    pdf-engine: lualatex
    variables:
      colorlinks: true
      linkcolor: colorLibro
      urlcolor: colorLibro
      filecolor: colorLibro
      citecolor: colorLibro
    include-in-header:
      - text: |
          \usepackage{xcolor}
          \definecolor{colorLibro}{HTML}{5A67D8}
      - ../_assets/base_pdf.tex
    toc: true
    toc-depth: 4
  epub:
    css: color.css
